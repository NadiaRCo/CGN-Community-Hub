<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGN Hub 🌻 Just Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:      #FFFBE0;
    --cream-2:    #FFF1E1;
    --sky-wash:   #EAF4D3;
    --sun:        #FFD83F;
    --sun-deep:   #F4B324;
    --coral:      #FF8E51;
    --tomato:     #FF6953;
    --barn-red:   #D6453D;
    --sky:        #5CD1FF;
    --sky-pale:   #C5F0FE;
    --pond:       #2E86D6;
    --pink:       #FFCFEC;
    --tulip:      #F48FB9;
    --pink-hot:   #FB63BE;
    --grape:      #9C8BEF;
    --grape-pale: #EBD6FF;
    --mtn:        #9C8FB5;
    --leaf:       #507335;
    --grass:      #7CC24E;
    --jf-green:   #5DA73C;
    --jf-red:     #80220F;
    --ink:        #303030;
    --ink-soft:   #5a5a52;
    --card:       #FFFFFF;
    --sidebar-w:  238px;

    --font-display: 'Fredoka', 'Nunito', sans-serif;
    --font-accent:  'Fredoka', 'Nunito', sans-serif;
    --font-body:    'Nunito', 'Segoe UI', sans-serif;
    --title-stroke: 0px;
  }
  body[data-font="retro"] {
    --font-display: 'Pacifico', cursive;
    --font-accent:  'Quicksand', sans-serif;
    --font-body:    'Quicksand', 'Segoe UI', sans-serif;
    --title-stroke: 1px;
  }
  body[data-font="clean"] {
    --font-display: 'Poppins', sans-serif;
    --font-accent:  'Poppins', sans-serif;
    --font-body:    'Poppins', 'Segoe UI', sans-serif;
  }

  /* ── Colour themes (🎨 selector — full look changes, viewer-friendly) ── */
  body { background: linear-gradient(180deg, var(--sky-wash) 0%, var(--cream) 320px); }

  /* 🌻 Sunny (default) uses the base palette above. */

  /* 🌿 Meadow — greens */
  body[data-bg="meadow"] {
    --cream: #F2F9E8; --cream-2: #E7F3D8; --sky-wash: #DDF0C8;
    --sun: #A9D97C; --sun-deep: #7CBB4E;
    background: linear-gradient(180deg, var(--sky-wash) 0%, var(--cream) 320px);
  }
  /* 💧 Sky — blues */
  body[data-bg="sky"] {
    --cream: #F0F8FC; --cream-2: #E2F1F9; --sky-wash: #D5EDF8;
    --sun: #9FDCF2; --sun-deep: #5CB8DE;
    background: linear-gradient(180deg, var(--sky-wash) 0%, var(--cream) 320px);
  }
  /* 🍊 Sunset — oranges */
  body[data-bg="sunset"] {
    --cream: #FFF3E4; --cream-2: #FFEAD2; --sky-wash: #FFE3C4;
    --sun: #FFB56B; --sun-deep: #F28C2E;
    background: linear-gradient(180deg, var(--sky-wash) 0%, var(--cream) 320px);
  }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ═══ TOP BAR ═══ */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 58px;
    background: var(--sun);
    border-bottom: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; gap: 8px;
  }
  .topbar .brand {
    font-family: var(--font-display);
    font-size: 21px; font-weight: 700; color: var(--jf-red);
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .topbar .brand small {
    font-family: var(--font-body); font-size: 12.5px; font-weight: 700;
    color: var(--ink-soft); padding-top: 3px;
  }
  .topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tb-btn, .tb-select {
    background: var(--card);
    border: 2.5px solid var(--ink);
    color: var(--ink); border-radius: 12px;
    padding: 6px 12px; font-size: 12.5px; font-weight: 800;
    cursor: pointer; font-family: var(--font-body);
    box-shadow: 2.5px 2.5px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .tb-btn:hover { transform: translate(-1px,-1px); box-shadow: 3.5px 3.5px 0 var(--ink); }
  .tb-btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  .tb-btn.editing { background: var(--tomato); color: white; }
  .tb-select { padding: 6px 8px; }

  /* ═══ LAYOUT ═══ */
  .layout { display: flex; padding-top: 58px; min-height: 100vh; }

  /* ═══ SIDEBAR ═══ */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--cream-2);
    border-right: 3px solid var(--ink);
    padding: 20px 14px;
    position: sticky; top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .nav-label {
    font-family: var(--font-accent);
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--jf-red);
    padding: 0 10px; margin: 14px 0 5px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; margin-bottom: 3px;
    border-radius: 12px; border: 2px solid transparent;
    font-size: 13px; font-weight: 800; color: var(--ink);
    cursor: pointer; text-decoration: none;
    transition: all 0.12s;
  }
  .nav-item:hover { background: var(--sky-pale); border-color: var(--ink); }
  .nav-item.active {
    background: var(--sun); border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .nav-item .ico { font-size: 15px; width: 20px; text-align: center; }
  .sidebar-art { margin-top: auto; padding-top: 16px; text-align: center; }
  .sidebar-art svg { width: 100%; max-width: 170px; }
  .sidebar-note {
    font-family: var(--font-accent); font-size: 12px; font-weight: 700;
    color: var(--ink-soft); text-align: center; margin-top: 5px;
  }

  /* ═══ MAIN ═══ */
  .main { flex: 1; padding: 32px 42px 40px; max-width: 960px; }
  .page-section { display: none; }
  .page-section.visible { display: block; animation: pop 0.25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .page-title {
    font-family: var(--font-display);
    font-size: 32px; font-weight: 700;
    color: var(--jf-red);
    -webkit-text-stroke: var(--title-stroke) var(--ink);
    text-shadow: 2.5px 2.5px 0 var(--sun);
    margin-bottom: 2px; display: inline-block;
  }
  .page-sub {
    font-family: var(--font-accent);
    font-size: 15px; font-weight: 600; color: var(--ink-soft);
    margin: 2px 0 20px;
  }
  .tulips {
    font-size: 17px; letter-spacing: 8px; line-height: 1;
    margin: 0 0 22px; opacity: 0.85; user-select: none;
    white-space: nowrap; overflow: hidden;
  }

  /* ═══ CARDS ═══ */
  .card {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 22px 26px;
    margin-bottom: 22px;
    position: relative;
  }
  .card h3 {
    font-family: var(--font-accent);
    font-size: 14px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--jf-red);
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .card h3::after { content: ''; flex: 1; height: 0; border-top: 2px dashed #e3d9b8; }
  .card h4.block-label, details.desc h4.block-label {
    font-family: var(--font-accent);
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--jf-green);
    margin: 16px 0 6px;
  }
  .card p.body-text { font-size: 13.5px; margin-bottom: 10px; }

  .corner-tag {
    position: absolute; top: -14px; right: 18px;
    font-family: var(--font-accent); font-size: 12.5px; font-weight: 700;
    background: var(--pink); border: 2px solid var(--ink);
    border-radius: 20px; padding: 2px 14px;
    transform: rotate(3deg);
    box-shadow: 2px 2px 0 var(--ink);
    z-index: 2;
  }
  .corner-tag.blue   { background: var(--sky-pale); transform: rotate(-2.5deg); }
  .corner-tag.yellow { background: var(--sun); transform: rotate(2deg); }
  .corner-tag.grape  { background: var(--grape-pale); transform: rotate(-2deg); }
  .corner-tag.left   { right: auto; left: 18px; transform: rotate(-2deg); }

  /* Deliverable collapsibles: number pill inside the summary, on the left */
  .deliv-pill {
    font-family: var(--font-accent); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: var(--sky-pale); border: 2px solid var(--ink);
    border-radius: 20px; padding: 2px 12px; flex-shrink: 0;
  }
  .deliv-pill.star { background: var(--grape-pale); }
  .deliv-pill.gold { background: var(--sun); }

  /* Posting calendar */
  .cal-grid { display: grid; grid-template-columns: 110px repeat(7, 1fr); gap: 5px; font-size: 11px; }
  .cal-head {
    font-family: var(--font-accent); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--jf-red); text-align: center; padding: 4px 2px;
  }
  .cal-week {
    font-family: var(--font-accent); font-weight: 700; font-size: 11px;
    display: flex; align-items: center; color: var(--ink-soft); padding-left: 4px;
  }
  .cal-cell {
    border: 1.5px solid #e3d9b8; border-radius: 8px;
    min-height: 44px; padding: 3px 5px; background: #FFFDF2;
    line-height: 1.3;
  }
  .cal-cell.ev-teaser   { background: #EAF6DC; border-color: var(--jf-green); font-weight: 700; }
  .cal-cell.ev-announce { background: var(--sky-pale); border-color: var(--sky); font-weight: 700; }
  .cal-cell.ev-count    { background: #FFE8D6; border-color: var(--coral); font-weight: 700; }
  .cal-cell.ev-day      { background: var(--pink); border-color: var(--pink-hot); font-weight: 700; }
  .cal-cell.ev-recap    { background: var(--grape-pale); border-color: var(--grape); font-weight: 700; }
  .cal-cell.ev-news     { background: var(--sun); border-color: var(--sun-deep); font-weight: 700; }

  /* Kate's Corner */
  .kates-corner {
    background: linear-gradient(135deg, #FFE9F6, var(--pink));
    border: 2.5px dashed var(--pink-hot);
    border-radius: 14px;
    padding: 13px 17px; margin-top: 14px;
    font-size: 13px;
  }
  .kates-corner .kc-title {
    font-family: var(--font-accent);
    font-size: 12.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--pink-hot);
    margin-bottom: 5px; display: flex; align-items: center; gap: 7px;
  }

  /* Good news */
  .goodnews-grid { display: flex; gap: 12px; flex-wrap: wrap; }
  .goodnews {
    flex: 1; min-width: 200px;
    border: 2.5px solid var(--ink); border-radius: 16px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 14px 18px; text-decoration: none; color: var(--ink);
    font-size: 13.5px; font-weight: 800;
    transition: transform 0.1s, box-shadow 0.1s;
    display: block;
  }
  .goodnews:hover { transform: translate(-1.5px,-1.5px); box-shadow: 4.5px 4.5px 0 var(--ink); }
  .goodnews small { display: block; font-weight: 600; font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .goodnews.g1 { background: var(--sun); transform: rotate(-0.8deg); }
  .goodnews.g2 { background: var(--pink); transform: rotate(0.6deg); }
  .goodnews.g3 { background: var(--sky-pale); transform: rotate(-0.5deg); }

  /* Focus grid */
  .focus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .focus-item {
    border-radius: 14px; padding: 14px 16px;
    border: 2px solid var(--ink);
    box-shadow: 2.5px 2.5px 0 var(--ink);
  }
  .focus-item.green  { background: #EAF6DC; }
  .focus-item.teal   { background: var(--sky-pale); }
  .focus-item.orange { background: #FFE8D6; }
  .focus-item.red    { background: var(--pink); }
  .focus-label {
    font-family: var(--font-accent); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--jf-red); margin-bottom: 3px;
  }
  .focus-text  { font-size: 13.5px; font-weight: 800; }
  .focus-note  { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  /* Task list */
  .task-list { list-style: none; }
  .task-list li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13.5px; padding: 9px 0;
    border-bottom: 2px dashed #eee4c3;
  }
  .task-list li:last-child { border-bottom: none; }
  .task-tag {
    font-size: 10.5px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.04em; border-radius: 20px; padding: 2px 10px;
    white-space: nowrap; flex-shrink: 0; margin-top: 2px;
    border: 1.5px solid var(--ink);
  }
  .tag-green  { background: #C9EBAB; }
  .tag-teal   { background: var(--sky-pale); }
  .tag-orange { background: var(--sun); }
  .tag-red    { background: var(--pink); }
  .tag-gray   { background: #EFEADC; }
  .tag-grape  { background: var(--grape-pale); }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .stat {
    background: var(--card); border: 2.5px solid var(--ink);
    border-radius: 16px; box-shadow: 3px 3px 0 var(--ink);
    padding: 16px 10px; text-align: center;
    transform: rotate(-0.6deg);
  }
  .stat:nth-child(2) { transform: rotate(0.7deg); background: var(--sky-pale); }
  .stat:nth-child(3) { transform: rotate(-0.4deg); background: var(--pink); }
  .stat:nth-child(4) { transform: rotate(0.5deg); background: var(--sun); }
  .stat .num { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--jf-red); line-height: 1.1; }
  .stat .lbl { font-family: var(--font-accent); font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-top: 3px; }

  /* Milestones */
  .win-item {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 14px;
    padding: 12px 0; border-bottom: 2px dashed #eee4c3;
    font-size: 13.5px; align-items: start;
  }
  .win-item:last-child { border-bottom: none; }
  .win-date { font-family: var(--font-accent); font-size: 13px; font-weight: 700; color: var(--jf-green); padding-top: 1px; }
  .win-body strong { display: block; margin-bottom: 2px; font-weight: 800; }
  .win-body p { font-size: 12.5px; color: var(--ink-soft); }

  /* Hero + farm scene */
  .hero {
    background: linear-gradient(180deg, var(--sky-wash) 0%, #F6FAE4 100%);
    border: 3px solid var(--ink); border-radius: 22px;
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 24px;
    text-align: center; position: relative; overflow: hidden;
    padding: 40px 40px 0;
  }
  .hero .welcome {
    font-family: var(--font-display);
    font-size: 48px; font-weight: 700; color: var(--jf-red);
    -webkit-text-stroke: var(--title-stroke) var(--ink);
    text-shadow: 3px 3px 0 var(--sun), 6px 6px 0 rgba(244,143,185,0.5);
    line-height: 1.2; display: block;
  }
  .hero p.tag {
    font-family: var(--font-accent); font-size: 17px; font-weight: 600;
    color: var(--ink-soft); margin-top: 10px; position: relative; z-index: 2;
  }
  .farm-scene { display: block; width: 100%; margin-top: 10px; }

  /* Roadmap */
  .roadmap-item {
    border-left: 3px dashed var(--ink);
    padding: 4px 0 18px 20px; margin-left: 10px;
    position: relative;
  }
  .roadmap-item::before {
    content: '🌱'; position: absolute; left: -13px; top: 2px;
    font-size: 18px; background: var(--cream); padding: 1px 0;
  }
  .roadmap-when {
    font-family: var(--font-accent); font-size: 12.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--jf-red);
  }
  .roadmap-what { font-size: 14.5px; font-weight: 800; margin: 1px 0 2px; }
  .roadmap-note { font-size: 12.5px; color: var(--ink-soft); }

  /* Note box */
  .note-box {
    background: var(--grape-pale); border: 2px solid var(--ink);
    border-radius: 14px; box-shadow: 2.5px 2.5px 0 var(--ink);
    padding: 14px 18px; font-size: 13.5px;
    display: flex; gap: 12px;
  }
  .note-box .icon { font-size: 22px; flex-shrink: 0; }

  /* Docs */
  .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .doc-item {
    background: var(--cream-2); border: 2px solid var(--ink);
    border-radius: 12px; box-shadow: 2px 2px 0 var(--ink);
    padding: 12px 15px;
    font-size: 13px; display: flex; gap: 10px; align-items: flex-start;
    color: var(--ink); text-decoration: none;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  a.doc-item:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); background: var(--sky-pale); }
  .doc-item .d-ico { font-size: 20px; }
  .doc-item strong { display: block; font-size: 13px; font-weight: 800; }
  .doc-item span.d-note { font-size: 11.5px; color: var(--ink-soft); }
  .doc-item .open-hint { font-size: 10.5px; font-weight: 900; color: var(--jf-green); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Sub-tabs */
  .subtabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .subtab {
    font-family: var(--font-accent);
    background: var(--card); border: 2px solid var(--ink);
    border-radius: 20px; padding: 6px 18px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .subtab.active { background: var(--sun); }
  .subpanel { display: none; }
  .subpanel.visible { display: block; }

  /* Attendance table */
  .att-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  .att-table th {
    font-family: var(--font-accent); text-align: left;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--jf-red); padding: 8px 12px;
    border-bottom: 2.5px solid var(--ink); background: var(--cream-2);
  }
  .att-table td { padding: 10px 12px; border-bottom: 2px dashed #eee4c3; vertical-align: top; }
  .att-table tr:last-child td { border-bottom: none; }
  .att-num { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--jf-green); }
  .asof {
    display: inline-block; font-size: 11px; font-weight: 900;
    background: var(--sun); border: 2px solid var(--ink); border-radius: 20px;
    padding: 2px 12px; margin-left: 8px; vertical-align: middle;
    text-transform: uppercase; letter-spacing: 0.04em;
  }

  /* Date chip */
  .date-chip {
    font-family: var(--font-accent);
    font-size: 11px; font-weight: 700; text-align: center;
    border: 2px solid var(--ink); border-radius: 10px;
    padding: 3px 9px; flex-shrink: 0; line-height: 1.25;
    background: var(--sun); min-width: 62px; margin-top: 1px;
  }
  .date-chip .d-day { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--jf-red); }
  .date-chip .d-md  { display: block; font-size: 12.5px; font-weight: 900; }
  .date-chip.teal { background: var(--sky-pale); }
  .date-chip.pink { background: var(--pink); }

  /* Poster gallery */
  .poster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .poster-card {
    border: 2.5px solid var(--ink); border-radius: 16px;
    box-shadow: 3px 3px 0 var(--ink);
    background: var(--cream-2); overflow: hidden;
  }
  .poster-card img { display: block; width: 100%; height: auto; border-bottom: 2.5px solid var(--ink); }
  .poster-missing {
    aspect-ratio: 4/5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    border-bottom: 2.5px solid var(--ink);
    background: repeating-linear-gradient(45deg, #FdF6D8, #FdF6D8 14px, #F6EDC4 14px, #F6EDC4 28px);
    color: var(--ink-soft); font-size: 12.5px; font-weight: 700;
    text-align: center; padding: 20px;
  }
  .poster-missing .big { font-size: 34px; }
  .poster-body { padding: 13px 16px; }
  .poster-body strong { font-size: 13.5px; font-weight: 800; display: block; }
  .poster-body .p-meta { font-size: 12px; color: var(--ink-soft); margin: 2px 0 8px; }
  .poster-check { list-style: none; font-size: 12px; }
  .poster-check li { display: flex; gap: 7px; padding: 3px 0; align-items: flex-start; }
  .pc-badge {
    font-size: 10px; font-weight: 900; border: 1.5px solid var(--ink);

const HUB = {"workshops": [{"id": "W0", "series": "summer2026", "title": "Connecting to Indigenous Plants and Traditional Food Systems", "who": "Harmony Eshkawkogan — Assembly of 7 Generations (a7g.ca)", "date": "2026-06-07", "when": "Sun, June 7, 2026 · 2:00–3:30 PM · Just Food Community Farm (in person)", "desc": "<p><em>TODO (Nadia): replace this paraphrase with the verbatim description from the <strong>Previous Workshops</strong> section of <a href=\"https://justfood.ca/upcoming-workshops/\" target=\"_blank\">justfood.ca/upcoming-workshops/</a>. WebFetch couldn&rsquo;t return the full text verbatim due to a quote-length limit.</em></p><p>Join Harmony Eshkawkogan of the Assembly of 7 Generations (A7G) to learn how urban Indigenous youth are connecting to the land through community gardens. The session covers plant identification &mdash; including Anishinaabemowin names and uses for plants like sweetgrass, sage and berries &mdash; how colonial policies cut Indigenous Peoples off from their lands and food traditions, and ways to support Indigenous food sovereignty, followed by Q&amp;A. The workshop closes with a Heart Garden activity where participants write or draw messages honouring children lost to residential schools, Survivors, and the Truth and Reconciliation Commission&rsquo;s legacy.</p>", "desc_fr": "<p><em>TODO Nadia&nbsp;: version FR à faire traduire et réviser.</em></p>", "img": "", "slides": []}, {"id": "W1", "series": "summer2026", "title": "Growing with the Land: Native Plants & Your Food Garden", "who": "Cynthia J. Benjamin — Ottawa Wildflower Seed Library", "date": "2026-07-08", "when": "Wed, July 8, 2026 · Zoom", "desc": "<h5>When / Where</h5>\n              <p>(Wed) July 8, 7pm – 8:30pm · Online, via Zoom</p>\n              <h5>Description</h5>\n              <p>Did you know that native plants and food gardening are more connected than most of us realise?</p>\n              <p>Many of us think of native plants and food growing as two separate gardening priorities - one for wildlife and pollinators, and one for nourishment. This workshop will show you how they are, in fact, deeply interdependent and how native plants are critical in sustaining habitats, ecosystems, and your garden.</p>\n              <p>Join us for an engaging session with Cynthia J. Benjamin, Vice-Chair of the Ottawa Wildflower Seed Library, who will guide you through the specific native plants that can directly support, strengthen, and boon your food garden.</p>\n              <p>This workshop is appropriate for all levels of gardeners. Whether you are a home grower, balcony gardener, or community garden member, you will leave with practical knowledge on how to grow with the land - not just on it.</p>\n              <p>In this workshop, you will learn:</p>\n              <ul>\n                <li>Which native plants to grow to support your food production, and why they work</li>\n                <li>How native plants support pollinators, soil health, and biodiversity in ways that benefit your edible garden</li>\n                <li>How to identify real native plants and where to source them responsibly in Ottawa</li>\n                <li>Simple first steps for introducing native plants into your existing growing space, no matter how big or small</li>\n              </ul>\n              <p>Just Food's Community Gardening Network is committed to programming that reflects our responsibilities as settlers and inhabitants of Turtle Island. Growing native plants is one small, grounded way to reconnect with the land and honour the (food) knowledge of the Algonquin Anishinaabe peoples who have been the stewards of these lands for millennia, and on whose unceded territory we garden. Just Food is committed to be a part of the ongoing work towards Truth and Reconciliation.</p>\n              <h5>About your Facilitator — Cynthia J. Benjamin, M.A.</h5>\n              <p>Cynthia is Vice-Chair of the Ottawa Wildflower Seed Library (OWSL), a grassroots organization dedicated to providing free access to native seeds, teaching responsible gardening, and building community around native plant growing.</p>\n              <p>With 35 years of experience in strategic planning, training, and community development, Cynthia brings a wealth of energy and real-world knowledge in her passion to preserve and nurture the natural world. One of her most beloved projects was spearheading the \"Inspiration Playground/Community Garden\" initiative from 2012 to 2017, which transformed over 7,000 square feet of pavement into an outdoor classroom, community garden, native plant and pollinator garden, and playground. It drew hundreds of volunteers and Cynthia received two House of Commons Volunteer Awards (2016 and 2017) for this work. Today, the space continues to thrive.</p>\n              <h5>Costs?</h5>\n              <p>The workshop is $10 or Pay-What-You-Can (PWYC) even if that's $0! Everyone is welcome to attend regardless of cost. If you wish to send an e-transfer before the session, please send your payment to financials@justfood.ca and indicate the name of the workshop in the \"notes\" section.</p>", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAMgAoADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9 ndigènes et compagnes", "url": "https://drive.google.com/file/d/1nF8mSoj-ejUx9uqJnsu1Bv65AyveBDdE/view?usp=sharing"}], "recording": ""}, {"id": "W2", "series": "summer2026", "title": "It's Not Too Late: Container Gardening for Growers in Small + Rented Spaces", "who": "Kate Veinot — Just Food", "date": "2026-07-13", "when": "Mon, July 13, 2026 · Zoom", "desc": "<h5>When / Where</h5>\n              <p>(Mon) July 13, 7pm – 8:30pm · Online, via Zoom</p>\n              <h5>Description</h5>\n              <p>It may be mid-July, but the growing season is far from over!</p>\n              <p>Whether you are new to gardening and growing on a windowsill, balcony, a backyard you can't dig up, or a community garden plot - there's still time for you to grow food this season.</p>\n              <p>Join Just Food's own Kate Veinot to learn about how container gardening is a great, versatile, and less physically demanding option for small space gardeners and renters.</p>\n              <p>In this workshop, you will learn:</p>\n              <ul>\n                <li>What crops you can still plant in July and actually harvest this year</li>\n                <li>How to choose the right containers and soil - what to look for at a garden centre</li>\n                <li>Beginner-friendly organic practices and special considerations for successful container growing</li>\n                <li>Set-up tips for small garden maximization: balconies, patios, railings, and windowsills</li>\n                <li>How to care for your plants: watering, feeding, and keeping things simple</li>\n                <li>What to expect and how to troubleshoot common first-timer challenges</li>\n                <li>And more!</li>\n              </ul>\n              <p>This workshop is entry-level and designed for people who have limited (or no) growing experience. Come ready with your questions, or submit them ahead of time to make sure they are addressed at the workshop.</p>\n              <h5>About your Facilitator — Kate Veinot, Just Food</h5>\n              <p>Kate Veinot is a Food Systems Planner (Neighbourhood &amp; Community Solutions) and Director at Just Food. Kate's background in food systems work has stemmed from years of small business experience in the food industry in Algonquin/Ottawa, and from being a longtime home-based food grower.</p>\n              <p>Kate's focus when it comes to their own gardening practices is on building soil health through low-till or no-dig methods, and promoting the importance of native species to support our pollinator friends. Their passion project is turning their front yard garden into an edible landscape with the help of their avid gardener kiddo!</p>", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAMgAoADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6OooorzigooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACioLi8t7V4kmlVHmbZGp6sfQCuX8X+JjbWt9ZWLlLq2EcjvnGAWHA9+n51EpqKuyJzUFdl/WvFtrpkCPABc7rj7O7A4SNhgncfoado/iOXWb+RIdLuEs1ztunO1WHYgHrmuDsdMuNZvnWC2huLO7YzGBbvHkMf4mx3/A9a9L0nSLbRrMW9sH29SXcsSfxrGnKc3foYUp1Kk en: Common Issues & Simple Solutions", "who": "Rob Danforth — Canadian Organic Growers", "date": "2026-07-16", "when": "Thu, July 16, 2026 · Zoom", "desc": "<h5>When / Where</h5>\n              <p>Thursday, July 16th, 7:00PM – 8:30PM · Online via Zoom</p>\n              <h5>Description</h5>\n              <p>No matter how carefully you plan or how experienced a gardener you are, every garden will face its share of challenges each season. From depleted soil and insect infestations to persistent critters, plant diseases, watering mishaps, nutrient deficiencies, and more, the hurdles can seem endless – but with the right knowledge, they don't have to stand in your way of enjoying a beautiful and productive garden.</p>\n              <p>Join us for this timely and insightful online workshop with expert organic gardener Rob Danforth, who will guide you through the most common garden problems. Rob will share proactive strategies to help you prevent issues before they start, as well as reactive solutions to help you troubleshoot problems effectively as they arise.</p>\n              <p>Participants will learn how to identify the signs of trouble early, create healthier garden ecosystems, and implement proven techniques to keep plants resilient and productive all season long. Whether you're a first-time grower looking to set yourself up for success or a seasoned gardener hoping to sharpen your skills, this workshop will leave you feeling prepared and empowered!</p>\n              <p>At the end of the session, there will be time for Q&amp;A! Make sure to bring your questions and garden challenges – this is your chance to gain personalized advice and practical tips from a seasoned expert!</p>\n              <h5>About your Facilitator — Rob Danforth</h5>\n              <p>Experienced urban food gardener (over 45 yrs.) &amp; organic gardening coach (over 15 yrs.) for Canadian Organic Growers Ottawa/St Lawrence/Outaouais Chapter (COGOSO), Senior Organic Gardeners (SOG), Just Food Ottawa, and private groups.</p>\n              <p>Past gardening experiences with vegetables, herbs, &amp; the flowers that support them in plots, raised beds, &amp; containers (pots, box beds, elevated beds, cold frames, composters, &amp; recycled items): Backyard 45 yrs. &amp; on-going; Gloucester Allotment Gardens (GAGA), 14 yrs.; Arrowsmith Community Gardens (JATGA) &amp; Gloucester Emergency Food Cupboard Garden (GEFC), 7 yrs. Past donor of organic vegetables &amp; herbs [most of our produce on the 2900 sq. ft. that we used to garden] to GEFC &amp; CCRC food banks (10 yrs.).</p>\n              <p>Gardening coach: 135 Live visits includes 14 hands-on workshops (3 to 35 participants), &amp; 13 consultation booths; 65 articles; 5 videos; 63 zooms [14 had 1 to 3 translators]; and 12 email/phone coaching contacts.</p>\n              <p>Past team member helping to found Senior Organic Gardeners (SOG) &amp; Arrowsmith Community Gardens (JATGA). Past volunteer at Gloucester Emergency Food Cupboard (GEFC 14 yrs).</p>\n              <ul>\n                <li>seniororganicgardeners.ca — see \"resources\" for comprehensive garden \"How To\" series (39 articles)</li>\n                <li>ottawa.cog.ca/category/seasonal-resources/ (65 articles)</li>\n                <li>justfood.ca → Community Gardening Network (CGN) → Gardening resources → pre-recorded gardening workshops (5 items)</li>\n              </ul>", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAMgAoADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQ p on July 30, this workshop will explore what friendship and relationship can look like in the garden.</p>\n              <p>Through companion planting, intensive intercropping, and polyculture, we can make better use of growing space while supporting healthier plants, greater biodiversity, and more resilient garden ecosystems. Rather than growing each crop in isolation, these approaches consider how plants can share space, provide shade or structure, attract pollinators and beneficial insects, reduce pest pressure, and support one another as they grow.</p>\n              <p>These approaches begin with a simple recognition: a garden is shaped by relationships. Plants interact not only with one another, but also with soil, insects, animals, people, and the wider ecosystem. The Three Sisters—corn, beans, and squash grown together—offer a well-known example of relational planting, with each plant contributing to the shared growing system.</p>\n              <p>Join Cole Etherington, a Métis farmer and founder of The Good Shit, for a practical session on designing intentional plant communities and bringing these principles into your own garden. Cole will share examples from his regenerative growing practices and offer practical ideas for growing more food in the space you have.</p>\n              <p>This workshop is intended for gardeners who are comfortable with the basics and want to expand their approach, but curious beginners are always welcome. 🍀</p>\n              <h5>About Your Facilitator — Cole Etherington, The Good Shit</h5>\n              <p>Cole Etherington is the founder of The Good Shit, a social enterprise dedicated to helping people and the planet, one organic garden at a time. With a professional background in sociology and knowledge translation, along with a passion for equity, food access, and climate action, Cole brings a unique perspective to the landscape of sustainable, resilient gardening.</p>\n              <p>Cole's gardening journey started with chickens 🐔. He noticed how their manure helped to rebuild the soil and thus the variety of plants that soil could nurture. The chickens eventually got rabbit 🐇 and goat 🐐 friends and that symbiotic relationship continues: What they leave behind feeds the soil. The soil feeds the plants. The plants feed people. Nothing is wasted. Everything is connected.</p>\n              <p>Over time, it became clear to Cole that sustainability is not only about how we grow, but who gets to grow. So The Good Garden was launched in 2025, as a nonprofit arm focused on community-led growing, education, and food access initiatives - to increase everyone's access to growing food. Because caring for the land also means caring for one another.</p>\n              <p>Find Cole at spreadthegoodshit.ca | @thegoodshit_today</p>", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAMgAoADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6RooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAoopks0cCb5XVFJC5Y45JwB+dAD6K868ReNZbzRpzp85smiuzCw3fvZIwOq+nPWrfhvUNV8SaqbxdZSC0jwTaRLvYD0YlcZP const PAGES = {"about": {"ico": "🌱", "title": {"en": "About the CGN", "fr": "À propos du RJC"}, "sub": {"en": "Ottawa’s community gardening network since 1997", "fr": "Le réseau de jardinage communautaire d’Ottawa depuis 1997"}, "fr_url": "https://alimentationjuste.ca/reseau-de-jardinage-communautaire/a-propos-du-reseau-de-jardinage-communautaire/", "blocks": [{"t": "p", "en": "The Community Gardening Network (CGN), established in 1997 and moved to Just Food in 2006, is an information and resource-sharing network that supports the sustainable development of community gardening across Algonquin land/Ottawa. The name reflects our work in supporting gardeners everywhere — on a balcony or yard, in a community garden, or just looking to learn more.", "fr": "Le Réseau de jardinage communautaire (RJC), fondé en 1997 et hébergé par Just Food depuis 2006, est un réseau d’échange d’information et de ressources qui soutient le développement durable du jardinage communautaire sur le territoire algonquin/Ottawa. Nous soutenons les jardiniers partout : sur un balcon, dans une cour, dans un jardin communautaire, ou simplement pour apprendre."}, {"t": "h", "en": "What we do", "fr": "Ce que nous faisons"}, {"t": "ul", "en": ["Help start new community gardens, including through the How to Start a Community Garden workshop", "Support existing gardens and their coordinators", "Fund garden development through the Community Garden Development Fund (CGDF)", "Work with public and private landowners to increase access to land", "Offer beginner gardening and food-preservation workshops, newsletters and events"], "fr": ["Aider à créer de nouveaux jardins communautaires, notamment grâce à l’atelier « Comment démarrer un jardin communautaire »", "Soutenir les jardins existants et leurs coordonnateurs", "Financer le développement des jardins grâce au Fonds de développement des jardins communautaires (FDJC)", "Collaborer avec des propriétaires publics et privés pour élargir l’accès à des terrains", "Offrir des ateliers de jardinage et de conservation des aliments, des infolettres et des événements"]}, {"t": "h", "en": "What counts as a community garden?", "fr": "Qu’est-ce qu’un jardin communautaire?"}, {"t": "p", "en": "They come in many forms: balcony gardens in an apartment building, large plot gardens, communal donation gardens, front-yard gardens, food forests, children’s gardens, school gardens and pollinator gardens. They are used mainly to grow food for personal use or donation — not for for-profit market gardening.", "fr": "Ils prennent de nombreuses formes : jardins de balcon dans un immeuble, grands jardins à parcelles, jardins communautaires de dons, jardins en façade, forêts comestibles, jardins d’enfants, jardins scolaires et jardins de pollinisateurs. Ils servent surtout à produire des aliments pour usage personnel ou pour des dons, et non à des fins commerciales."}, {"t": "h", "en": "Benefits of joining the CGN as a garden", "fr": "Avantages d’adhérer au RJC pour un jardin"}, {"t": "ul", "en": ["It’s free", "Community Garden Development Fund (CGDF) grants, and help with the application", "Help starting up and looking for land; soil testing", "Newsletter for Coordinators and access to FoodChat, our online discussion platform", "Seeds, seedlings, soil and/or compost", "Problem-solving support when issues arise", "City of Ottawa insurance coverage; Trail Road mulch/wood chips as available", "Shared tools and CGN storage space; a free community bank account", "Gardening skills workshops and connections with other gardens"], "fr": ["C’est gratuit", "Subventions du FDJC et aide pour la demande", "Aide au démarrage et à la recherche de terrain; analyse du sol", "Infolettre pour les coordonnateurs et accès à FoodChat, notre plateforme de discussion", "Semences, plants, terre et/ou compost", "Soutien pour résoudre les problèmes", "Couverture d’assurance de la Ville d’Ottawa; copeaux de bois de Trail Road selon la disponibilité", "Outils partagés et espace d’entreposage du RJC; compte bancaire communautaire gratuit", "Ateliers de jardinage et liens avec d’autres jardins"]}, {"t": "note", "en": "Have a community garden and want to join? Email communitygardening@justfood.ca. Content adapted from the Just Food website.", "fr": "Vous avez un jardin communautaire et souhaitez vous joindre au RJC? Écrivez à communitygardening@justfood.ca. Contenu adapté du site de Just Food."}]}, "find": {"ico": "📍", "title": {"en": "Find a Community Garden", "fr": "Trouver un jardin communautaire"}, "sub": {"en": "Look for a plot or a donation garden near you", "fr": "Cherchez une parcelle ou un jardin de dons près de chez vous"}, "fr_url": "https://alimentationjuste.ca/reseau-de-jardinage-communautaire/", "blocks": [{"t": "steps", "items": [{"en": "Open the CGN Community Garden Map and find gardens near you.", "fr": "Ouvrez la carte des jardins communautaires du RJC et repérez les jardins près de chez vous.", "url": "https://justfood.ca/community-gardening-network/community-gardening-network-guide/", "link": {"en": "Open the map ↗", "fr": "Ouvrir la carte ↗"}}, {"en": "Click a garden’s pin to find its coordinator’s contact details, and write to them directly to ask about a plot.", "fr": "Cliquez sur l’épingle d’un jardin pour trouver les coordonnées de son coordonnateur et écrivez-lui directement pour demander une parcelle."}, {"en": "Many gardens have waitlists and prioritize neighbours close to the garden. Ask to join the list — and ask about donation or communal plots.", "fr": "Beaucoup de jardins ont une liste d’attente et priorisent les voisins. Demandez à vous inscrire — et renseignez-vous sur les parcelles de dons ou communes."}, {"en": "No garden nearby, or all are full? Consider starting one.", "fr": "Aucun jardin à proximité, ou tous sont complets? Envisagez d’en démarrer un.", "page": "start", "link": {"en": "How to start a garden →", "fr": "Comment démarrer un jardin →"}}]}, {"t": "cards", "items": [{"title": {"en": "Community gardens", "fr": "Jardins communautaires"}, "body": {"en": "Plots for individual rental, plus donation plots and communal beds such as herb or tea gardens.", "fr": "Parcelles à louer, parcelles de dons et plates-bandes communes (herbes, thé)."}}, {"title": {"en": "School gardens", "fr": "Jardins scolaires"}, "body": {"en": "Used by teachers and students as part of the curriculum; not open for individual plots.", "fr": "Utilisés par le personnel enseignant et les élèves; pas de parcelles individuelles."}}, {"title": {"en": "Plant-a-Row, Share-a-Row gardens", "fr": "Jardins Plantez une rangée, partagez une rangée"}, "body": {"en": "Grow produce for neighbourhood food cupboards. Volunteers welcome; contact the coordinator.", "fr": "Produisent des légumes pour les comptoirs alimentaires. Bénévoles bienvenus; contactez le coordonnateur."}}, {"title": {"en": "Children’s & communal gardens", "fr": "Jardins d’enfants et communs"}, "body": {"en": "Spaces for children’s learning and shared growing. Write to us to learn how they work.", "fr": "Espaces d’apprentissage pour les enfants et de culture partagée. Écrivez-nous pour en savoir plus."}}]}, {"t": "links", "items": [{"en": "Community Garden Profiles", "fr": "Profils des jardins communautaires", "url": "https://justfood.ca/community-gardening-network/cgprofiles/"}, {"en": "Find a Community Garden (Just Food)", "fr": "Trouver un jardin communautaire (Just Food)", "url": "https://justfood.ca/community-gardening-network/find-a-community-garden/"}]}, {"t": "note", "en": "Is a garden’s contact on the map out of date? Let us know through the Contact page and we will update it.", "fr": "Les coordonnées d’un jardin sur la carte sont périmées? Dites-le-nous par la page Contact et nous les mettrons à jour."}]}, "start": {"ico": "🚜", "title": {"en": "Start a Community Garden", "fr": "Démarrer un jardin communautaire"}, "sub": {"en": "A step-by-step path, with support at every stage", "fr": "Un parcours étape par étape, avec du soutien à chaque étape"}, "fr_url": "https://alimentationjuste.ca/reseau-de-jardinage-communautaire/creer-un-jardin-communautaire/", "blocks": [{"t": "p", "en": "Starting a community garden takes time and a dedicated team. The CGN can guide you from first idea to first harvest.", "fr": "Démarrer un jardin communautaire demande du temps et une équipe engagée. Le RJC peut vous accompagner de l’idée à la première récolte."}, {"t": "steps", "items": [{"en": "Attend a How to Start a Community Garden workshop — the first step, and required for CGDF funding (at least one team member).", "fr": "Participez à un atelier « Comment démarrer un jardin communautaire » — première étape, obligatoire pour le financement du FDJC (au moins une personne de l’équipe).", "url": "https://justfood.ca/community-gardening-network/how-to-start-a-community-garden-workshop/", "link": {"en": "About the workshop ↗", "fr": "À propos de l’atelier ↗"}}, {"en": "Find at least two other people to help coordinate the garden early on.", "fr": "Trouvez au moins deux autres personnes pour aider à coordonner le jardin au départ."}, {"en": "Build community support: community associations, health and resource centres, your city councillor, schools, faith groups, BIAs, youth groups.", "fr": "Obtenez l’appui de la communauté : associations communautaires, centres de santé et de ressources, conseiller municipal, écoles, groupes confessionnels, ZAC, groupes de jeunes."}, {"en": "Identify possible land. GeoOttawa shows whether a parcel is City, private, a hydro corridor, or slated for development.", "fr": "Repérez des terrains possibles. GéoOttawa indique si une parcelle appartient à la Ville, est privée, est un corridor d’hydro ou est destinée à un aménagement.", "url": "https://maps.ottawa.ca/geoottawa/", "link": {"en": "GeoOttawa ↗", "fr": "GéoOttawa ↗"}}, {"en": "City land: since January 5, 2026, apply directly to the City’s team (ottawa.ca/gardens). NCC land: contact the CGN first — we are the NCC’s designated lead coordinator for community gardens. The CGN will still help with planning and your proposal.", "fr": "Terrain municipal : depuis le 5 janvier 2026, présentez une demande directement à l’équipe de la Ville (ottawa.ca/jardins). Terrain de la CCN : communiquez d’abord avec le RJC, coordonnateur désigné des jardins communautaires pour la CCN. Le RJC vous aide à planifier et à préparer votre proposition.", "url": "https://ottawa.ca/gardens", "link": {"en": "Ottawa.ca/gardens ↗", "fr": "Ottawa.ca/jardins ↗"}}, {"en": "Apply to the Community Garden Development Fund (CGDF) — rolling applications, no deadline, for new and existing gardens.", "fr": "Présentez une demande au Fonds de développement des jardins communautaires (FDJC) — demandes en continu, sans date limite, pour jardins nouveaux et existants.", "url": "https://justfood.ca/community-gardening-network/community-garden-development-fund/", "link": {"en": "About the CGDF ↗", "fr": "À propos du FDJC ↗"}}, {"en": "Test your soil. Professional testing is required for CGDF funding or a new garden on City land (the CGDF can fund it).", "fr": "Faites analyser votre sol. Une analyse professionnelle est requise pour le financement du FDJC ou un nouveau jardin sur un terrain municipal (le FDJC peut la financer).", "url": "https://justfood.ca/soil-testing-urban-impacted-soils/", "link": {"en": "Soil testing guide ↗", "fr": "Guide d’analyse du sol ↗"}}]}, {"t": "note", "en": "Just Food’s stance on raised beds: if soil is viable and free of harmful contaminants, we endorse in-ground beds (except accessible raised beds). Already have a garden? Email communitygardening@justfood.ca to join the CGN. Content adapted from the Just Food website; dates and processes change, so confirm with the CGN.", "fr": "Position de Just Food sur les plates-bandes surélevées : si le sol est sain et exempt de contaminants nocifs, nous recommandons la culture en pleine terre (sauf plates-bandes surélevées accessibles). Vous avez déjà un jardin? Écrivez à communitygardening@justfood.ca. Contenu adapté du site de Just Food; les dates et processus changent, confirmez auprès du RJC."}]}, "coordinators": {"ico": "🧑‍🌾", "title": {"en": "For Coordinators", "fr": "Pour les coordonnateurs"}, "sub": {"en": "Tools, support and a place to learn from each other", "fr": "Outils, soutien et lieu d’apprentissage entre pairs"}, "fr_url": "https://alimentationjuste.ca/reseau-de-jardinage-communautaire/", "blocks": [{"t": "p", "en": "Coordinating a garden is a big job. This page collects what the CGN offers and what we are building for you. New to coordinating? Start with Just Food’s guide for new coordinators.", "fr": "Coordonner un jardin est une grande tâche. Cette page rassemble ce que le RJC offre et ce que nous préparons pour vous. Nouveau coordonnateur? Commencez par le guide de Just Food."}, {"t": "links", "items": [{"en": "Are you a new coordinator? (Just Food)", "fr": "Nouveau coordonnateur? (Just Food)", "url": "https://justfood.ca/community-gardening-network/cg-coordinators-resources/"}, {"en": "Community Garden Development Fund", "fr": "Fonds de développement des jardins communautaires", "url": "https://justfood.ca/community-gardening-network/community-garden-development-fund/"}, {"en": "Soil testing guide", "fr": "Guide d’analyse du sol", "url": "https://justfood.ca/soil-testing-urban-impacted-soils/"}, {"en": "Accessible gardening", "fr": "Jardinage accessible", "url": "https://justfood.ca/community-gardening-network/accessible-gardening/"}]}, {"t": "h", "en": "What the CGN offers your garden", "fr": "Ce que le RJC offre à votre jardin"}, {"t": "ul", "en": ["Coordinator newsletter and the FoodChat discussion platform", "CGDF grants, application help and soil testing support", "Insurance through the City of Ottawa; tools, trailer and storage; free bank account; mulch and compost as available", "Garden signs, printed and bilingual (EN/FR)", "An annual garden evaluation that helps us understand your needs", "One-on-one support — write to the CGN to arrange a call or a visit"], "fr": ["Infolettre pour les coordonnateurs et plateforme de discussion FoodChat", "Subventions du FDJC, aide à la demande et à l’analyse du sol", "Assurance de la Ville d’Ottawa; outils, remorque et entreposage; compte bancaire gratuit; paillis et compost selon la disponibilité", "Panneaux de jardin imprimés et bilingues (FR/EN)", "Une évaluation annuelle des jardins pour comprendre vos besoins", "Soutien individuel — écrivez au RJC pour planifier un appel ou une visite"]}, {"t": "h", "en": "In development — coming soon", "fr": "En préparation — bientôt"}, {"t": "p", "en": "We are building a shared toolbox for coordinators. Each tool below is reviewed by the CGN team before it goes public. If one of these would make your work easier sooner, write to communitygardening@justfood.ca — knowing what's most needed helps us prioritise.", "fr": "Nous construisons une boîte à outils commune pour les coordonnateurs. Chaque outil ci-dessous est révisé par l'équipe du RJC avant d'être publié. Si l'un d'eux vous serait utile plus vite, écrivez à communitygardening@justfood.ca — savoir ce qui est le plus demandé nous aide à prioriser."}, {"t": "h", "en": "Running your garden", "fr": "Faire fonctionner votre jardin"}, {"t": "cards", "items": [{"ico": "📋", "title": {"en": "Season-start checklist", "fr": "Liste de vérification de début de saison"}, "body": {"en": "Dates, work days, plot sign-up, waitlists, keys and tools.", "fr": "Dates, corvées, inscription aux parcelles, listes d'attente, clés et outils."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}, {"ico": "📝", "title": {"en": "Gardener agreement templates", "fr": "Modèles d'ententes pour jardiniers"}, "body": {"en": "Sample rules and agreements coordinators can adapt.", "fr": "Exemples de règles et d'ententes à adapter."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}, {"ico": "🤝", "title": {"en": "Welcoming and keeping gardeners", "fr": "Accueillir et garder les jardiniers"}, "body": {"en": "Recruiting, onboarding and communicating with your gardeners.", "fr": "Recrutement, accueil et communication avec vos jardiniers."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}, {"ico": "🧭", "title": {"en": "Tricky situations and who to call", "fr": "Situations délicates et qui appeler"}, "body": {"en": "Conflict, safety, vandalism and when to contact the CGN or the City.", "fr": "Conflits, sécurité, vandalisme et quand contacter le RJC ou la Ville."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}, {"ico": "♿", "title": {"en": "Accessibility and inclusion", "fr": "Accessibilité et inclusion"}, "body": {"en": "Making plots, paths and meetings welcoming for everyone.", "fr": "Rendre parcelles, sentiers et réunions accueillants pour tous."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}, {"ico": "💰", "title": {"en": "Funding and reporting", "fr": "Financement et rapports"}, "body": {"en": "CGDF walk-through and small-grant sources.", "fr": "Le FDJC pas à pas et sources de petites subventions."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}]}, {"t": "h", "en": "Running workshops at your garden", "fr": "Animer des ateliers dans votre jardin"}, {"t": "p", "en": "Several of these are being adapted from existing CGN internal guides — expect to see them through the winter.", "fr": "Plusieurs de ces outils sont adaptés de guides internes existants du RJC — attendez-vous à les voir au cours de l'hiver."}, {"t": "cards", "items": [{"ico": "🗓️", "title": {"en": "Workshop planning guide", "fr": "Guide de planification d'atelier"}, "body": {"en": "From booking a facilitator to the day-of run-sheet — adapted from the CGN internal planning guide.", "fr": "De la réservation d'un animateur au déroulé du jour J — adapté du guide interne du RJC."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}, {"ico": "🎓", "title": {"en": "Facilitation toolkit", "fr": "Boîte à outils d'animation"}, "body": {"en": "Setting intentions, grounding activities, holding space, and inclusive practices for CGN workshops.", "fr": "Intentions, activités d'ancrage, tenir l'espace et pratiques inclusives pour les ateliers du RJC."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}, {"ico": "📣", "title": {"en": "Promoting your workshop or event", "fr": "Promouvoir votre atelier ou événement"}, "body": {"en": "Email templates, poster tips and timing — adapted from the CGN promotion & emails guide.", "fr": "Modèles de courriels, conseils pour affiches et moments à privilégier — adapté du guide de promotion du RJC."}, "status": {"en": "Coming soon", "fr": "Bientôt"}}]}]}, "guides": {"ico": "📖", "title": {"en": "Gardening Guides", "fr": "Guides de jardinage"}, "sub": {"en": "Grow food in Ottawa — in your language", "fr": "Cultivez à Ottawa — dans votre langue"}, "fr_url": "https://alimentationjuste.ca/reseau-de-jardinage-communautaire/ressources-de-jardinage/", "blocks": [{"t": "h", "en": "CGN Garden Guide (in five languages)", "fr": "Guide du jardinier du RJC (en cinq langues)"}, {"t": "p", "en": "An easy beginner guide to gardening in the Ottawa region — from soil, composting and seeds to harvesting and preparing for winter.", "fr": "Un guide simple pour débuter le jardinage dans la région d’Ottawa — du sol, du compostage et des semences jusqu’à la récolte et la préparation à l’hiver."}, {"t": "links", "items": [{"en": "English (PDF)", "fr": "Anglais (PDF)", "url": "http://justfood.ca/wp-content/uploads/2015/03/CGN_Garden_Guide_2015.pdf"}, {"en": "Français (PDF)", "fr": "Français (PDF)", "url": "http://justfood.ca/wp-content/uploads/2015/03/CGN_Garden_Guide_2015_Francais.pdf"}, {"en": "Español (PDF)", "fr": "Español (PDF)", "url": "http://justfood.ca/wp-content/uploads/2020/04/CGN-Garden-Guide-2015_SP2-1.pdf"}, {"en": "العربية (PDF)", "fr": "العربية (PDF)", "url": "http://justfood.ca/wp-content/uploads/2020/04/CGN-Garden-Guide-2015-AR.pdf"}, {"en": "中文 (PDF)", "fr": "中文 (PDF)", "url": "http://justfood.ca/wp-content/uploads/2020/04/CGN-Garden-Guide-2019-MA.pdf"}]}, {"t": "h", "en": "More guides and free learning", "fr": "Autres guides et apprentissage gratuit"}, {"t": "links", "items": [{"en": "Pre-recorded gardening workshops (container gardening, indoor seed starting, natural pest control)", "fr": "Ateliers de jardinage préenregistrés (jardinage en contenants, semis à l’intérieur, lutte antiparasitaire naturelle)", "url": "https://justfood.ca/community-gardening-network/gardeningworkshops/"}, {"en": "Additional gardening guides (harvesting, seed collecting, soil testing, pest control, native plants)", "fr": "Autres guides (récolte, collecte de semences, analyse du sol, lutte antiparasitaire, plantes indigènes)", "url": "https://justfood.ca/community-gardening-network/gardening-resources/additional-gardening-guides/"}, {"en": "Front yard edible gardening — benefits, rules in Ottawa, and cautions", "fr": "Jardins comestibles en façade — avantages, règles à Ottawa et précautions", "url": "https://justfood.ca/community-gardening-network/gardening-resources/front-yard-edible-gardens/"}, {"en": "Pollinator gardening — Ecology Ottawa", "fr": "Jardins de pollinisateurs — Écologie Ottawa", "url": "https://www.ecologyottawa.ca/pollinator_garden_resources"}, {"en": "Ottawa Wildflower Seed Library", "fr": "Bibliothèque de semences de fleurs sauvages d’Ottawa", "url": "https://wildflowerseedlibrary.ca"}, {"en": "Gardening events across the region — GardeningCalendar.ca", "fr": "Événements de jardinage dans la région — GardeningCalendar.ca", "url": "https://gardeningcalendar.ca/events/ottawa/"}]}, {"t": "h", "en": "Ottawa growing season at a glance", "fr": "La saison de culture à Ottawa en un coup d’œil"}, {"t": "p", "en": "Ottawa is roughly hardiness zone 5. Published average last-frost dates range from about May 6 to May 13 (cautious gardeners wait until mid-May), and the first fall frost is usually in early October. These are averages — always check the forecast before planting tender crops.", "fr": "Ottawa se situe à peu près en zone de rusticité 5. Les dates moyennes du dernier gel printanier varient du 6 au 13 mai environ (les jardiniers prudents attendent la mi-mai) et le premier gel d’automne survient généralement début octobre. Ce sont des moyennes : consultez toujours les prévisions avant de planter des cultures sensibles."}, {"t": "table", "head": [{"en": "When", "fr": "Quand"}, {"en": "What to do", "fr": "Quoi faire"}], "rows": [[{"en": "Jan – Feb", "fr": "Janv. – févr."}, {"en": "Plan your garden, order seeds, go to seed swaps (Seedy Saturday).", "fr": "Planifiez, commandez vos semences, participez aux échanges de semences."}], [{"en": "March", "fr": "Mars"}, {"en": "Start slow crops indoors — peppers about 8 weeks and cabbages 6–8 weeks before the last frost.", "fr": "Semez à l’intérieur les cultures lentes — poivrons environ 8 semaines et choux 6 à 8 semaines avant le dernier gel."}], [{"en": "April", "fr": "Avril"}, {"en": "When soil is workable, sow hardy crops like peas, spinach, lettuce and radishes; prepare beds.", "fr": "Quand le sol est travaillable, semez des cultures rustiques (pois, épinards, laitue, radis); préparez les plates-bandes."}], [{"en": "Mid-May", "fr": "Mi-mai"}, {"en": "After frost risk passes: beans, corn, then tomato and pepper transplants a week or two later.", "fr": "Après le risque de gel : haricots, maïs, puis plants de tomates et de poivrons une ou deux semaines plus tard."}], [{"en": "June – August", "fr": "Juin – août"}, {"en": "Water, mulch, weed, succession-sow and harvest; share extra through Plant-a-Row, Share-a-Row.", "fr": "Arrosez, paillez, désherbez, faites des semis successifs et récoltez; partagez le surplus avec Plantez une rangée, partagez une rangée."}], [{"en": "Sept – Oct", "fr": "Sept. – oct."}, {"en": "Harvest and preserve, save seed, plant garlic, cover or mulch beds before winter.", "fr": "Récoltez et conservez, gardez des semences, plantez l’ail, couvrez ou paillez les plates-bandes avant l’hiver."}], [{"en": "Nov – Dec", "fr": "Nov. – déc."}, {"en": "Rest and review: what grew well? Join winter workshops and plan next year.", "fr": "Repos et bilan : qu’est-ce qui a bien poussé? Participez aux ateliers d’hiver et planifiez l’an prochain."}]]}, {"t": "note", "en": "General guidance for Ottawa, based on published frost-date averages (Lawn by Season, The Old Farmer’s Almanac, TDC). The CGN Garden Guide has detailed advice.", "fr": "Conseils généraux pour Ottawa, fondés sur des moyennes publiées de dates de gel. Le guide du jardinier du RJC contient des conseils détaillés."}]}, "faq": {"ico": "❓", "title": {"en": "FAQs", "fr": "FAQ"}, "sub": {"en": "Quick answers to common questions", "fr": "Réponses rapides aux questions courantes"}, "fr_url": "https://alimentationjuste.ca/reseau-de-jardinage-communautaire/", "blocks": [{"t": "faq", "items": [{"q": {"en": "How do I get a plot in a community garden?", "fr": "Comment obtenir une parcelle dans un jardin communautaire?"}, "a": {"en": "Use the Community Garden Map, click a garden’s pin and contact its coordinator directly. Many gardens have waitlists and prioritize nearby residents.", "fr": "Utilisez la carte des jardins communautaires, cliquez sur l’épingle d’un jardin et contactez directement son coordonnateur. Beaucoup de jardins ont une liste d’attente et priorisent les résidents du voisinage."}}, {"q": {"en": "Is it free to join the CGN?", "fr": "L’adhésion au RJC est-elle gratuite?"}, "a": {"en": "Yes. Community gardens can join the CGN for free and receive support, resources and access to funding.", "fr": "Oui. Les jardins communautaires peuvent adhérer gratuitement au RJC et recevoir soutien, ressources et accès au financement."}}, {"q": {"en": "How do I start a community garden?", "fr": "Comment démarrer un jardin communautaire?"}, "a": {"en": "Begin by attending a How to Start a Community Garden workshop, then follow the steps on the Start a Garden page.", "fr": "Commencez par un atelier « Comment démarrer un jardin communautaire », puis suivez les étapes de la page Démarrer un jardin."}}, {"q": {"en": "Is there money to help build a garden?", "fr": "Y a-t-il du financement pour aménager un jardin?"}, "a": {"en": "Yes — the Community Garden Development Fund (CGDF) accepts applications year-round. At least one team member must have attended the workshop.", "fr": "Oui — le FDJC accepte des demandes toute l’année. Au moins une personne de l’équipe doit avoir suivi l’atelier."}}, {"q": {"en": "Do I need to test my soil?", "fr": "Dois-je faire analyser mon sol?"}, "a": {"en": "Yes if you are applying for CGDF funding or building on City land. We recommend testing for any garden in the city. See the soil testing guide.", "fr": "Oui, si vous demandez le financement du FDJC ou aménagez sur un terrain municipal. Nous recommandons l’analyse pour tout jardin en ville. Consultez le guide d’analyse du sol."}}, {"q": {"en": "Can I grow food in my front yard?", "fr": "Puis-je cultiver des aliments dans ma cour avant?"}, "a": {"en": "Often yes — see the front yard edible gardening page for Ottawa’s rules and cautions.", "fr": "Souvent oui — consultez la page sur les jardins comestibles en façade pour connaître les règles d’Ottawa et les précautions."}}, {"q": {"en": "Where can I find the slides from a workshop?", "fr": "Où trouver les diapositives d’un atelier?"}, "a": {"en": "On the Slides page under CGN Workshops. If a workshop’s slides aren’t there yet, write to us.", "fr": "Sur la page Diapositives sous Ateliers du RJC. Si elles n’y sont pas encore, écrivez-nous."}}, {"q": {"en": "How do I suggest a workshop topic or facilitator?", "fr": "Comment proposer un sujet d’atelier ou un animateur?"}, "a": {"en": "Use the Contact page — we love hearing ideas, and welcome people with growing experience who’d like to teach.", "fr": "Utilisez la page Contact — nous aimons les idées et accueillons les personnes expérimentées qui souhaitent enseigner."}}]}]}};   /* info pages: e /* ── Calendar ── */
let calM=new Date(); calM=new Date(calM.getFullYear(),calM.getMonth(),1);
const CAL_CATS = ['Workshop','Seeds','Market','Community','Social'];
let calFilter = 'All'; // 'All' or one of CAL_CATS; workshops are always shown.
function allEvents(){
  const ev=(HUB.events||[]).map((e,i)=>Object.assign({id:'e'+i,type:e.type||'event'},e));
  HUB.workshops.forEach(w=>ev.push({id:'w'+w.id,type:'workshop',category:'Workshop',date:w.date,title:w.title,time:w.when,where:'',who:w.who,host:w.who,target:w.id,url:w.register||''}));
  return ev.sort((a,b)=>a.date.localeCompare(b.date));
}
function filteredEvents(){ return allEvents().filter(e=>calFilter==='All'||e.category===calFilter||(calFilter==='Workshop'&&!e.category&&e.type==='workshop')); }
function setCalFilter(c){ calFilter=c; document.getElementById('calBox').innerHTML=calHtml(); }
function calMove(d){const n=new Date();calM=d===0?new Date(n.getFullYear(),n.getMonth(),1):new Date(calM.getFullYear(),calM.getMonth()+d,1);document.getElementById('calBox').innerHTML=calHtml()}
function isoD(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function catLabel(c){ const fr=lang==='fr'; const m={All:fr?'Tous':'All',Workshop:fr?'Ateliers':'Workshops',Seeds:fr?'Semences':'Seeds',Market:fr?'Marchés':'Markets',Community:fr?'Communauté':'Community',Social:fr?'Social':'Social'}; return m[c]||c; }
function calHtml(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const ev=filteredEvents(),tdy=isoD(new Date()),loc=lang==='fr'?'fr-CA':'en-CA';
  const filter=`<div class="cal-filter">${['All',...CAL_CATS].map(c=>`<button class="cal-chip${calFilter===c?' active':''} cat-${c.toLowerCase()}" onclick="setCalFilter('${c}')">${catLabel(c)}</button>`).join('')}</div>`;
  let g=''; for(let i=0;i<7;i++) g+=`<div class="mc-dow">${new Date(2024,0,7+i).toLocaleDateString(loc,{weekday:'short'})}</div>`;
  const cells=Math.ceil((first+dim)/7)*7;
  for(let c=0;c<cells;c++){
    const dt=new Date(y,m,1-first+c),ds=isoD(dt),out=dt.getMonth()!==m;
    const es=ev.filter(e=>e.date===ds).map(e=>`<span class="mc-ev ${e.type}" onclick="calOpen('${e.id}')" title="${esc(L(e,'title'))}">${esc(L(e,'title'))}</span>`).join('');
    g+=`<div class="mc-day${out?' out':''}${ds===tdy?' today':''}"><span class="n">${dt.getDate()}</span>${es}</div>`;
  }
  const mine=ev.filter(e=>e.date.slice(0,7)===y+'-'+String(m+1).padStart(2,'0'));
  const fmt=e=>new Date(e.date+'T12:00:00').toLocaleDateString(loc,{weekday:'short',month:'short',day:'numeric'});
  return `${filter}<div class="mc-head"><h4>${calM.toLocaleDateString(loc,{month:'long',year:'numeric'})}</h4><button class="tb-btn" onclick="calMove(-1)">‹</button><button class="tb-btn" onclick="calMove(0)">${t('today')}</button><button class="tb-btn" onclick="calMove(1)">›</button></div>
   <div class="mc-grid">${g}</div><div class="mc-detail" id="calDetail"></div>
   <h4 class="block-label" style="margin-top:16px">${t('thismonth')}</h4>
   <ul class="mc-agenda" style="padding:0">${mine.length?mine.map(e=>`<li onclick="calOpen('${e.id}')"><strong>${fmt(e)}</strong> — ${esc(L(e,'title'))}${e.category?` <span class="cat-dot cat-${e.category.toLowerCase()}" title="${esc(catLabel(e.category))}"></span>`:''}${e.time?` <span style="color:var(--ink-soft)">· ${esc(e.time)}</span>`:''}</li>`).join(''):`<li style="cursor:default;font-style:italic">${t('nothing')}</li>`}</ul>`;
}
function calOpen(id){
  const e=allEvents().find(x=>x.id===id); if(!e) return;
  const box=document.getElementById('calDetail'); if(!box) return;
  const fr=lang==='fr';
  const link=e.target?`<a class="send-btn" href="#" onclick="go('ws-upcoming');return false">${t('open')} →</a>`:(e.url?`<a class="send-btn" href="${esc(e.url)}" target="_blank" onclick="track('view','event: '+${JSON.stringify(e.title)},'calendar')">${fr?'Plus d’info':'More info'} ↗</a>`:'');
  const hostLine=e.host?`<div style="margin-top:4px;color:var(--ink-soft);font-size:13px">${fr?'Organisé par':'Hosted by'}: ${esc(e.host)}</div>`:'';
  const catBadge=e.category?`<span class="cat-badge cat-${e.category.toLowerCase()}">${esc(catLabel(e.category))}</span>`:'';
  box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><strong style="font-size:15px">${esc(L(e,'title'))}</strong>${catBadge}</div>${e.time?'<div>'+esc(e.time)+'</div>':''}${e.where?'<div>'+t('where')+': '+esc(e.where)+'</div>':''}${hostLine}<div style="margin-top:8px">${link}</div>`;
  box.style.display='block'; track('view','calendar: '+e.title,'calendar');
}

  const P=k=>I(k,PAGES[k].ico,esc(T2(PAGES[k].title)));

   `<div class="nav-label">${t('other')}</div>`+I('resources','📚',t('resources'))+P('faq')+I('contact','💌',t('contact'))+ART_SVG.replace(/<div class="sidebar-note"[^>]*>[\s\S]*?<\/div>/,'')+`<div class="sidebar-note">${t('quote')}</div>`;
}

const T2=o=>o?(o[lang]||o.en):'';
function blockHtml(bk){
  const X=k=>bk[k]&&typeof bk[k]==='object'&&!Array.isArray(bk[k])?T2(bk[k]):bk[k];
  if(bk.t==='p') return `<p class="body-text">${esc(bk[lang]||bk.en)}</p>`;
  if(bk.t==='h') return `<h4 class="block-label" style="margin-top:16px">${esc(bk[lang]||bk.en)}</h4>`;
  if(bk.t==='note') return `<div class="tk-callout info"><span class="ic">ℹ️</span><span>${esc(bk[lang]||bk.en)}</span></div>`;
  if(bk.t==='ul') return `<ul class="ec-ul" style="padding-left:20px;font-size:14px">${(bk[lang]||bk.en).map(i=>`<li style="margin:5px 0">${esc(i)}</li>`).join('')}</ul>`;
  if(bk.t==='steps') return `<div>${bk.items.map((s,i)=>`<div class="tk-step"><div class="tk-num">${i+1}</div><div style="flex:1"><div class="body-text" style="margin:0">${esc(s[lang]||s.en)}</div>${s.url?`<a class="desc-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(T2(s.link)||'↗')}</a>`:''}${s.page?`<a class="desc-link" href="#" onclick="go('${s.page}');return false">${esc(T2(s.link))}</a>`:''}</div></div>`).join('')}</div>`;
  if(bk.t==='links') return `<ul style="padding:0">${bk.items.map(i=>`<li style="list-style:none;margin:7px 0">📎 <a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:var(--jf-green);font-weight:800" onclick="track('download',${JSON.stringify(i.en)},'guide')">${esc(i[lang]||i.en)}</a></li>`).join('')}</ul>`;
  if(bk.t==='cards') return `<div class="poster-grid">${bk.items.map(c=>`<div class="poster-card tool-card ${c.status?'status-'+(c.status.en||'').toLowerCase().replace(/[^a-z0-9]+/g,'-'):''}"><div class="poster-body">${c.ico?`<div class="tool-ico" aria-hidden="true">${c.ico}</div>`:''}<strong>${esc(T2(c.title))}</strong><div class="p-meta" style="margin:4px 0 6px;color:var(--ink-soft)">${esc(T2(c.body))}</div>${c.status?`<span class="pc-badge pc-tbc">${esc(T2(c.status))}</span>`:''}</div></div>`).join('')}</div>`;
  if(bk.t==='table') return `<div class="cw-table-wrap"><table class="cw-table"><thead><tr>${bk.head.map(h=>`<th>${esc(T2(h))}</th>`).join('')}</tr></thead><tbody>${bk.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(T2(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(bk.t==='faq') return bk.items.map(f=>`<details class="desc" style="margin:8px 0"><summary onclick="track('view','faq: '+${JSON.stringify(f.q.en)},'faq')">${esc(T2(f.q))}</summary><div class="desc-body"><p>${esc(T2(f.a))}</p></div></details>`).join('');
  return '';
}
function pageHtml(k){
  const p=PAGES[k];
  const fr=(lang==='fr'&&p.fr_url)?`<div class="tk-callout warn"><span class="ic">🇫🇷</span><span>${t('draft_fr')} <a href="${esc(p.fr_url)}" target="_blank" rel="noopener">${t('fr_link')}</a></span></div>`:'';
  const body=p.blocks.map(blockHtml).join('');
  return head(p.ico+' '+T2(p.title),T2(p.sub))+fr+`<div class="card">${body}</div>`;
