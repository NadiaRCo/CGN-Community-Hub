const BGS={default:{en:'🌻 Sunny',fr:'🌻 Ensoleillé'},meadow:{en:'🌿 Meadow',fr:'🌿 Prairie'},sky:{en:'💧 Sky',fr:'💧 Ciel'},sunset:{en:'🍊 Sunset',fr:'🍊 Coucher de soleil'}};
let lang=(function(){try{return (localStorage.getItem('cgn-comm-lang')||(navigator.language||'en').slice(0,2))==='fr'?'fr':'en'}catch(e){return 'en'}})();
const t=k=>(I18N[lang][k]||k);
const SRC=new URLSearchParams(location.search).get('src')||'';
function track(type,text,section){
  if(!BACKEND_URL){console.log('[track]',type,text,section);return}
  try{fetch(BACKEND_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({author:SRC||'anonymous',type:type,page:section||'',section:SRC,text:text||''})})}catch(e){}
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setFont(v){document.body.dataset.font=v;try{localStorage.setItem('cgn-comm-font',v)}catch(e){}}
function setBg(v){document.body.dataset.bg=v;try{localStorage.setItem('cgn-comm-bg',v)}catch(e){}}
function toggleLang(){lang=lang==='en'?'fr':'en';try{localStorage.setItem('cgn-comm-lang',lang)}catch(e){};document.documentElement.lang=lang;render()}
function go(id){document.querySelectorAll('.page-section').forEach(s=>s.classList.toggle('visible',s.id===id));document.querySelectorAll('#side .nav-item').forEach(n=>n.classList.toggle('active',n.dataset.p===id));window.scrollTo(0,0);track('view',id,id)}
function dl(id,i){const w=HUB.workshops.find(x=>x.id===id);const s=w.slides[i];track('download',w.id+' · '+s.label,'slides');window.open(s.url,'_blank')}
const todayD=()=>new Date(new Date().toDateString());
const isUp=w=>new Date(w.date+'T23:59:59')>=todayD();
const L=(o,k)=>(lang==='fr'&&o[k+'_fr'])?o[k+'_fr']:o[k];
function slideBtns(w){return (w.slides||[]).map((s,i)=>`<button class="send-btn" onclick="dl('${w.id}',${i})">⬇ ${esc(L(s,'label'))}</button>`).join('')||`<span class="send-btn btn-off">${t('noslides')}</span>`}
function wcard(w){
  const rec=w.recording?`<a class="send-btn" href="${esc(w.recording)}" target="_blank" onclick="track('view','recording ${w.id}','recording')">▶ ${t('recording')}</a>`:'';
  const reg=w.register?`<a class="send-btn" href="${esc(w.register)}" target="_blank">${t('register')}</a>`:'';
  const imgHtml = w.img ? `<img src="${w.img}" alt="${esc(w.title)}">` : '<div class="poster-noimg" aria-hidden="true">🌱</div>';
  return `<div class="poster-card" id="wk-${w.id}">${imgHtml}<div class="poster-body"><strong>${esc(w.title)}</strong><div class="p-meta">${esc(w.who)}<br>${esc(w.when)}</div>
  <details onclick="track('view','desc ${w.id}','description')"><summary>${t('desc')}</summary><div class="dd">${w.desc}</div></details>
  <div class="wk-btns">${isUp(w)?reg:slideBtns(w)+rec}</div></div></div>`}
function artHtml(a){return `<strong style="font-size:17px">${esc(L(a,'title'))}</strong><div class="p-meta" style="color:var(--ink-soft);font-size:12.5px">${esc(a.author||'')} · ${esc(a.date||'')}</div><p class="body-text" style="margin:8px 0">${esc(L(a,'blurb'))}</p><a class="send-btn" href="${esc(a.url)}" target="_blank" onclick="track('view','article: '+${JSON.stringify(a.title)},'article')">${t('readmore')} ↗</a>`}
/* head() now lives in source/garden.js */

/* ── Calendar ── */
let calM=new Date(); calM=new Date(calM.getFullYear(),calM.getMonth(),1);
const CAL_CATS = ['Workshop','Seeds','Market','Community','Social'];
let calFilter = 'All'; // 'All' or one of CAL_CATS; workshops are always shown.
function allEvents(){
  const ev=(HUB.events||[]).map((e,i)=>Object.assign({id:'e'+i,type:e.type||'event'},e));
  HUB.workshops.forEach(w=>ev.push({id:'w'+w.id,type:'workshop',category:'Workshop',date:w.date,title:w.title,time:w.when,where:'',who:w.who,host:w.who,target:w.id,url:w.register||''}));
  return ev.sort((a,b)=>a.date.localeCompare(b.date));
}
function filteredEvents(){ return allEvents().filter(e=>calFilter==='All'||e.category===calFilter||(calFilter==='Workshop'&&!e.category&&e.type==='workshop')); }
function setCalFilter(c){ calFilter=c; document.getElementById('calBox').innerHTML=calHtml(); }
function calMove(d){const n=new Date();calM=d===0?new Date(n.getFullYear(),n.getMonth(),1):new Date(calM.getFullYear(),calM.getMonth()+d,1);document.getElementById('calBox').innerHTML=calHtml()}
function isoD(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function catLabel(c){ const fr=lang==='fr'; const m={All:fr?'Tous':'All',Workshop:fr?'Ateliers':'Workshops',Seeds:fr?'Semences':'Seeds',Market:fr?'Marchés':'Markets',Community:fr?'Communauté':'Community',Social:fr?'Social':'Social'}; return m[c]||c; }
function calHtml(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const ev=filteredEvents(),tdy=isoD(new Date()),loc=lang==='fr'?'fr-CA':'en-CA';
  const filter=`<div class="cal-filter">${['All',...CAL_CATS].map(c=>`<button class="cal-chip${calFilter===c?' active':''} cat-${c.toLowerCase()}" onclick="setCalFilter('${c}')">${catLabel(c)}</button>`).join('')}</div>`;
  let g=''; for(let i=0;i<7;i++) g+=`<div class="mc-dow">${new Date(2024,0,7+i).toLocaleDateString(loc,{weekday:'short'})}</div>`;
  const cells=Math.ceil((first+dim)/7)*7;
  for(let c=0;c<cells;c++){
    const dt=new Date(y,m,1-first+c),ds=isoD(dt),out=dt.getMonth()!==m;
    const es=ev.filter(e=>e.date===ds).map(e=>`<span class="mc-ev ${e.type}" onclick="calOpen('${e.id}')" title="${esc(L(e,'title'))}">${esc(L(e,'title'))}</span>`).join('');
    g+=`<div class="mc-day${out?' out':''}${ds===tdy?' today':''}"><span class="n">${dt.getDate()}</span>${es}</div>`;
  }
  const mine=ev.filter(e=>e.date.slice(0,7)===y+'-'+String(m+1).padStart(2,'0'));
  const fmt=e=>new Date(e.date+'T12:00:00').toLocaleDateString(loc,{weekday:'short',month:'short',day:'numeric'});
  return `${filter}<div class="mc-head"><h4>${calM.toLocaleDateString(loc,{month:'long',year:'numeric'})}</h4><button class="tb-btn" onclick="calMove(-1)">‹</button><button class="tb-btn" onclick="calMove(0)">${t('today')}</button><button class="tb-btn" onclick="calMove(1)">›</button></div>
   <div class="mc-grid">${g}</div><div class="mc-detail" id="calDetail"></div>
   <h4 class="block-label" style="margin-top:16px">${t('thismonth')}</h4>
   <ul class="mc-agenda" style="padding:0">${mine.length?mine.map(e=>`<li onclick="calOpen('${e.id}')"><strong>${fmt(e)}</strong> — ${esc(L(e,'title'))}${e.category?` <span class="cat-dot cat-${e.category.toLowerCase()}" title="${esc(catLabel(e.category))}"></span>`:''}${e.time?` <span style="color:var(--ink-soft)">· ${esc(e.time)}</span>`:''}</li>`).join(''):`<li style="cursor:default;font-style:italic">${t('nothing')}</li>`}</ul>`;
}
function calOpen(id){
  const e=allEvents().find(x=>x.id===id); if(!e) return;
  const box=document.getElementById('calDetail'); if(!box) return;
  const fr=lang==='fr';
  const link=e.target?`<a class="send-btn" href="#" onclick="go('ws-upcoming');return false">${t('open')} →</a>`:(e.url?`<a class="send-btn" href="${esc(e.url)}" target="_blank" onclick="track('view','event: '+${JSON.stringify(e.title)},'calendar')">${fr?'Plus d’info':'More info'} ↗</a>`:'');
  const hostLine=e.host?`<div style="margin-top:4px;color:var(--ink-soft);font-size:13px">${fr?'Organisé par':'Hosted by'}: ${esc(e.host)}</div>`:'';
  const catBadge=e.category?`<span class="cat-badge cat-${e.category.toLowerCase()}">${esc(catLabel(e.category))}</span>`:'';
  box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><strong style="font-size:15px">${esc(L(e,'title'))}</strong>${catBadge}</div>${e.time?'<div>'+esc(e.time)+'</div>':''}${e.where?'<div>'+t('where')+': '+esc(e.where)+'</div>':''}${hostLine}<div style="margin-top:8px">${link}</div>`;
  box.style.display='block'; track('view','calendar: '+e.title,'calendar');
}

function nav(){
  const I=(p,ico,l)=>`<a class="nav-item" data-p="${p}" tabindex="0" role="link" onclick="go('${p}')" onkeydown="if(event.key==='Enter')go('${p}')"><span class="ico">${ico}</span> ${l}</a>`;
  const P=k=>I(k,PAGES[k].ico,esc(T2(PAGES[k].title)));
  document.getElementById('side').innerHTML=`<div class="nav-label">${t('start')}</div>`+I('home','🏡',t('home'))+P('about')+I('article','📰',t('article'))+
   `<div class="nav-label">${t('g_gardens')}</div>`+P('find')+P('start')+P('coordinators')+P('guides')+
   `<div class="nav-label">${t('g_ws')}</div>`+I('ws-upcoming','📅',t('ws_upcoming'))+I('ws-past','🖼️',t('ws_past'))+I('ws-slides','⬇️',t('ws_slides'))+
   `<div class="nav-label">${t('other')}</div>`+I('resources','📚',t('resources'))+P('faq')+I('contact','💌',t('contact'))+gardenSideArt()+`<div class="sidebar-note">${t('quote')}</div>`;
}
/* ── Generic info-page renderer ── */
const T2=o=>o?(o[lang]||o.en):'';
function blockHtml(bk){
  const X=k=>bk[k]&&typeof bk[k]==='object'&&!Array.isArray(bk[k])?T2(bk[k]):bk[k];
  if(bk.t==='p') return `<p class="body-text">${esc(bk[lang]||bk.en)}</p>`;
  if(bk.t==='h') return `<h4 class="block-label" style="margin-top:16px">${esc(bk[lang]||bk.en)}</h4>`;
  if(bk.t==='note') return `<div class="tk-callout info"><span class="ic">ℹ️</span><span>${esc(bk[lang]||bk.en)}</span></div>`;
  if(bk.t==='ul') return `<ul class="ec-ul" style="padding-left:20px;font-size:14px">${(bk[lang]||bk.en).map(i=>`<li style="margin:5px 0">${esc(i)}</li>`).join('')}</ul>`;
  if(bk.t==='steps') return `<div>${bk.items.map((s,i)=>`<div class="tk-step"><div class="tk-num">${i+1}</div><div style="flex:1"><div class="body-text" style="margin:0">${esc(s[lang]||s.en)}</div>${s.url?`<a class="desc-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(T2(s.link)||'↗')}</a>`:''}${s.page?`<a class="desc-link" href="#" onclick="go('${s.page}');return false">${esc(T2(s.link))}</a>`:''}</div></div>`).join('')}</div>`;
  if(bk.t==='links') return `<ul style="padding:0">${bk.items.map(i=>`<li style="list-style:none;margin:7px 0">📎 <a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:var(--jf-green);font-weight:800" onclick="track('download',${JSON.stringify(i.en)},'guide')">${esc(i[lang]||i.en)}</a></li>`).join('')}</ul>`;
  if(bk.t==='cards') return `<div class="poster-grid">${bk.items.map(c=>`<div class="poster-card tool-card ${c.status?'status-'+(c.status.en||'').toLowerCase().replace(/[^a-z0-9]+/g,'-'):''}"><div class="poster-body">${c.ico?`<div class="tool-ico" aria-hidden="true">${c.ico}</div>`:''}<strong>${esc(T2(c.title))}</strong><div class="p-meta" style="margin:4px 0 6px;color:var(--ink-soft)">${esc(T2(c.body))}</div>${c.status?`<span class="pc-badge pc-tbc">${esc(T2(c.status))}</span>`:''}</div></div>`).join('')}</div>`;
  if(bk.t==='table') return `<div class="cw-table-wrap"><table class="cw-table"><thead><tr>${bk.head.map(h=>`<th>${esc(T2(h))}</th>`).join('')}</tr></thead><tbody>${bk.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(T2(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(bk.t==='faq') return bk.items.map(f=>`<details class="desc" style="margin:8px 0"><summary onclick="track('view','faq: '+${JSON.stringify(f.q.en)},'faq')">${esc(T2(f.q))}</summary><div class="desc-body"><p>${esc(T2(f.a))}</p></div></details>`).join('');
  return '';
}
function pageHtml(k){
  const p=PAGES[k];
  const fr=(lang==='fr'&&p.fr_url)?`<div class="tk-callout warn"><span class="ic">🇫🇷</span><span>${t('draft_fr')} <a href="${esc(p.fr_url)}" target="_blank" rel="noopener">${t('fr_link')}</a></span></div>`:'';
  const body=p.blocks.map(blockHtml).join('');
  return head(p.ico+' '+T2(p.title),T2(p.sub),k)+fr+`<div class="card">${body}</div>`;
}

function farmCard(){
  const fr = lang === 'fr';
  return `<div class="card side-card" id="farmCard">
    <span class="corner-tag green">${fr?'Visite 🚜':'Visit 🚜'}</span>
    <h3>🚜 ${fr?'Visiter la ferme communautaire de Just Food':'Visit the Just Food Community Farm'}</h3>
    <p class="body-text">${fr
      ?'Une ferme communautaire de 150 acres dans la Ceinture de verdure de la CCN, bordée du ruisseau Green, à Blackburn Hamlet.'
      :'A 150-acre community farm in the NCC Greenbelt next to Green’s Creek, in Blackburn Hamlet.'}</p>
    <p class="body-text"><strong>${fr?'Adresse':'Address'}&nbsp;:</strong> 2391 P&eacute;pin Court, Ottawa K1B 4Z3
      <br><small style="color:var(--ink-soft)"><em>TODO (Nadia): confirm &mdash; the Just Food website footer shows 2389; this page uses 2391 to match the workshop pages.</em></small></p>
    <p class="body-text"><strong>${fr?'S’y rendre':'Getting there'}&nbsp;:</strong> ${fr?'autobus #25, pistes cyclables, stationnement gratuit sur place':'#25 bus route, bike paths, free parking on site'}.</p>
    <p class="body-text" style="font-size:13px;font-style:italic;color:var(--ink-soft)">${fr
      ?'La ferme se trouve sur le territoire traditionnel et non cédé de la Nation anishinaabe algonquine.'
      :'The farm is on the traditional, unceded territory of the Anishinaabe Algonquin Nation.'}</p>
    <h4 class="block-label" style="margin-top:10px">${fr?'Ce que vous pouvez faire':'What you can do'}</h4>
    <ul class="body-text" style="padding-left:18px;margin:4px 0 8px">
      <li>${fr?'Marcher sur les chemins principaux pendant les heures d’ouverture et voir ce qui pousse':'Walk the main roads during open hours and see what’s growing'}</li>
      <li>${fr?'Pique-niquer près de la grange':'Picnic by the barn'}</li>
      <li>${fr?'Participer aux événements et ateliers communautaires':'Join community events and workshops'}</li>
      <li>${fr?'Faire du bénévolat':'Volunteer'}</li>
    </ul>
    <h4 class="block-label">${fr?'Règles pour visiteurs (en bref)':'Visitor rules (short)'}</h4>
    <ul class="body-text" style="padding-left:18px;margin:4px 0 10px">
      <li>${fr?'Enfants accompagnés d’un adulte':'Children accompanied by an adult'}</li>
      <li>${fr?'Rester hors des champs cultivés':'Stay out of fields where food is growing'}</li>
      <li>${fr?'Stationner dans le stationnement; pas de vélo &mdash; marchez-le':'Park in the lot; walk (don’t ride) bicycles'}</li>
      <li>${fr?'Chiens bienvenus en laisse, sur les sentiers seulement &mdash; ce n’est pas un parc à chiens':'Dogs welcome on leash and on paths only (it’s not a dog park)'}</li>
      <li>${fr?'Certains espaces peuvent accueillir des événements privés':'Some areas may have private events'}</li>
    </ul>
    <div class="wk-btns" style="margin-top:12px">
      <a class="send-btn" href="https://justfood.ca/just-food-farm/farmrules/" target="_blank" onclick="track('view','farm rules','farmcard')">${fr?'Planifier votre visite ↗':'Plan your visit ↗'}</a>
      <a class="send-btn" href="https://justfoodfarmstand.com/" target="_blank" rel="noopener" onclick="track('view','farm stand','farmcard')">\uD83E\uDD55 ${fr?'Commander au kiosque de la ferme \u2197':'Order from the Just Food Farm Stand \u2197'}</a>
    </div>
  </div>`;
}

    <p class="body-text" style="margin:0 0 10px">${fr?'Nouvelles, ateliers et appels à l’action du réseau et de Just Food.':'News, workshops and calls-to-action from the network and Just Food.'}</p>

/*__GARDEN_JS__*/
function render(){
  const cur=(document.querySelector('.page-section.visible')||{}).id||'home';
  document.getElementById('brandTxt').textContent=t('brand');document.getElementById('brandSmall').textContent=t('small');
  const ftTag=document.getElementById('footTag'); if(ftTag) ftTag.textContent=t('small');
  document.getElementById('langBtn').textContent=lang==='en'?'FR':'EN';
  document.getElementById('tbResources').textContent=t('resources');
  document.getElementById('tbFaq').textContent=T2(PAGES['faq'].title);
  document.getElementById('tbContact').textContent=t('contact');
  document.getElementById('tbIncident').textContent=lang==='fr'?'Signaler un incident':'Report an incident';
  nav();
  const upc=HUB.workshops.filter(isUp).sort((a,b)=>a.date.localeCompare(b.date));
  const past=HUB.workshops.filter(w=>!isUp(w)).sort((a,b)=>b.date.localeCompare(a.date));
  const art=HUB.articles[0], srcW=HUB.workshops.find(w=>w.id===SRC);
  const now=new Date(),h=now.getHours(),loc=lang==='fr'?'fr-CA':'en-CA';
  document.getElementById('home').innerHTML=gardenHero()+gardenAlmanac()+
   `<div class="card"><span class="corner-tag blue">${t('quick')}</span><h3>🧭 ${t('quick')}</h3><div class="doc-grid">${['find','start','coordinators','guides'].map(k=>`<a class="doc-item" href="#" onclick="go('${k}');return false"><span class="d-ico">${PAGES[k].ico}</span><div><strong>${esc(T2(PAGES[k].title))}</strong><span class="d-note">${esc(T2(PAGES[k].sub))}</span></div></a>`).join('')}<a class="doc-item" href="#" onclick="go('ws-upcoming');return false"><span class="d-ico">📅</span><div><strong>${t('g_ws')}</strong><span class="d-note">${t('ws_upcoming')} · ${t('ws_past')} · ${t('ws_slides')}</span></div></a><a class="doc-item" href="#" onclick="go('resources');return false"><span class="d-ico">📚</span><div><strong>${t('resources')}</strong><span class="d-note">${t('res_sub')}</span></div></a></div></div>
    <div class="card"><span class="corner-tag yellow">${t('aow')} 📰</span><h3>📰 ${t('aow')}</h3>${art?artHtml(art):`<p class="body-text" style="font-style:italic;color:var(--ink-soft)">${t('noart')}</p>`}</div>
    <div class="card"><span class="corner-tag">${t('cal')} 📅</span><h3>📅 ${t('cal')}</h3><p class="body-text" style="color:var(--ink-soft)">${t('cal_sub')}</p><div id="calBox">${calHtml()}</div></div>
    ${srcW?`<div class="card"><span class="corner-tag yellow">${t('welcome_ws')} 🌻</span><h3>🌻 ${t('welcome_ws')}</h3><p class="body-text">${t('thanks')}</p><div class="poster-grid">${wcard(srcW)}</div></div>`:''}
    ${upc.length?`<div class="card"><span class="corner-tag blue">${t('upcoming')} 🌷</span><h3>🌷 ${t('upcoming')}</h3><div class="poster-grid">${upc.map(wcard).join('')}</div></div>`:''}
    ${farmCard()}
    ${followCard()}`;
  document.getElementById('heroTitle').textContent=t('welcome');document.getElementById('heroTag').textContent=t('tag');
  const dg=document.getElementById('dayGreeting'); if(dg) dg.textContent=(h<12?'☀️ '+t('greet_m'):h<18?'🌤️ '+t('greet_a'):'🌙 '+t('greet_e'))+'! '+t('its')+' '+now.toLocaleDateString(loc,{weekday:'long',month:'long',day:'numeric'});
  Object.keys(PAGES).forEach(k=>{document.getElementById(k).innerHTML=pageHtml(k)});
  document.getElementById('incident').innerHTML=incidentHtml(); almanacFill();
  document.getElementById('article').innerHTML=head(t('article'),t('art_sub'),'article')+(HUB.articles.length?HUB.articles.map((a,i)=>`${i==1?`<h3 class="page-sub" style="font-weight:800">${t('prev_art')}</h3>`:''}<div class="card">${artHtml(a)}</div>`).join(''):`<div class="card"><p class="body-text" style="font-style:italic">${t('noart')}</p></div>`);
  document.getElementById('ws-upcoming').innerHTML=head(t('ws_upcoming'),'','ws-upcoming')+(upc.length?`<div class="card"><div class="poster-grid">${upc.map(wcard).join('')}</div></div>`:`<div class="card"><p class="body-text" style="font-style:italic">${t('noup')}</p></div>`);
  document.getElementById('ws-past').innerHTML=head(t('ws_past'),'','ws-past')+Object.keys(HUB.series).map(s=>{const l=past.filter(w=>w.series===s).sort((a,b)=>a.date.localeCompare(b.date));return l.length?`<div class="card"><span class="corner-tag yellow">${HUB.series[s][lang]}</span><h3>🖼️ ${HUB.series[s][lang]}</h3><div class="poster-grid">${l.map(wcard).join('')}</div></div>`:''}).join('');
  document.getElementById('ws-slides').innerHTML=head(t('ws_slides'),t('slides_sub'),'ws-slides')
    +`<div class="card">`+past.map(w=>`<div class="srow"><strong>${esc(w.title)}</strong><div class="p-meta" style="color:var(--ink-soft);font-size:12.5px">${esc(w.who)} · ${esc(w.when)}</div><div class="wk-btns">${slideBtns(w)}${w.recording?`<a class="send-btn" href="${esc(w.recording)}" target="_blank">▶ ${t('recording')}</a>`:''}</div></div>`).join('')+`</div>`;
  const tags=[...new Set(HUB.resources.flatMap(r=>r.tags||[]))];
  document.getElementById('resources').innerHTML=head(t('resources'),t('res_sub'),'resources')+`<div class="card"><input class="cm-in" id="rs" placeholder="${t('search')}" oninput="resList()"><div id="rt"><span class="deliv-pill" style="cursor:pointer" onclick="resTag('')">${t('all')}</span> ${tags.map(x=>`<span class="deliv-pill" style="cursor:pointer" onclick="resTag('${esc(x)}')">${esc(x)}</span>`).join(' ')}</div><div id="rl" style="margin-top:12px"></div></div>`;
  resList();
  document.getElementById('contact').innerHTML=head(t('c_title'),t('c_sub'),'contact')+`<div class="card"><span class="corner-tag">💌</span>
   <label class="cm-lab">${t('c_type')}</label><select class="cm-in" id="ct">${[1,2,3,4,5].map(i=>`<option value="${esc(t('c_t'+i))}">${t('c_t'+i)}</option>`).join('')}</select>
   <label class="cm-lab">${t('c_msg')}</label><textarea class="cm-in" id="cm" rows="5"></textarea><label class="cm-lab">${t('c_name')}</label><input class="cm-in" id="cn"><label class="cm-lab">${t('c_email')}</label><input class="cm-in" id="ce" type="email">
   <button class="send-btn" onclick="sendContact()">${t('c_send')}</button>
   <div class="cm-ok" id="cok">${t('c_ok')} <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>.</div></div>
   <div class="card"><h3>📞 ${t('c_info')}</h3><p class="body-text">✉️ <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a><br>📞 ${t('phone')}: 613-824-7771<br>📍 ${t('addr')}: Just Food Community Farm, 2389 Pépin Court, Ottawa K1B 4Z3</p></div>
   <div class="card"><span class="corner-tag yellow">📬</span><h3>📬 ${t('stay')}</h3><p class="body-text">${t('stay_sub')}</p><a class="send-btn" href="https://mailchi.mp/justfood/newsletters" target="_blank" rel="noopener">${t('news')} ↗</a></div>`;
  go(cur);
}
let _tag='';
function resTag(x){_tag=x;resList()}
function resList(){const s=((document.getElementById('rs')||{}).value||'').toLowerCase();
  const l=HUB.resources.filter(r=>(!_tag||(r.tags||[]).includes(_tag))&&((r.title+' '+(r.title_fr||'')).toLowerCase().includes(s)));
  document.getElementById('rl').innerHTML=l.length?l.map(r=>`<p style="margin:6px 0">📎 <a href="${esc(r.url)}" target="_blank" style="color:var(--jf-green);font-weight:800" onclick="track('download',${JSON.stringify(r.title)},'resource')">${esc(L(r,'title'))}</a></p>`).join(''):`<p class="body-text">—</p>`}
function sendContact(){
  const m=document.getElementById('cm').value.trim(); if(!m) return;
  const typ=document.getElementById('ct').value,n=document.getElementById('cn').value,e=document.getElementById('ce').value;
  track('contact',typ+' | '+m.slice(0,300),'contact');
  location.href='mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent('[CGN Hub] '+typ)+'&body='+encodeURIComponent(m+'\n\n—\n'+(n?n+'\n':'')+(e?'Reply to: '+e:''));
  document.getElementById('cok').style.display='block';
}
gardenInit();
document.documentElement.lang=lang;
render();go('home');
</script>
